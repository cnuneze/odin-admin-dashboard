<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="icons.css">
    <link rel="stylesheet" href="styles.css" />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="container">
      <!-- Side bar menu -->
      <aside class="sidebar">
        <div class="sidebar-title">
          <span class="icon i-dashboard" aria-hidden="true"></span>
          <h1>Dashboard</h1>
        </div>

        <ul class="sidebar-menu">
          <li><span class="icon i-home"></span><a href=">#">Home</a></li>
          <li><span class="icon i-profile"></span><a href="#">Profile</a></li>
          <li><span class="icon i-messages"></span><a href="#">Messages</a></li>
          <li><span class="icon i-history"></span><a href="#">History</a></li>
          <li><span class="icon i-tasks"></span><a href="#">Tasks</a></li>
          <li><span class="icon i-communities"></span><a href="#">Communities</a></li>
        </ul>

        <ul class="sidebar-options">
          <li><span class="icon i-settings"></span><a href="#">Setings</a></li>
          <li><span class="icon i-support"></span><a href="#">Support</a></li>
          <li><span class="icon i-privacy"></span><a href="#">Privacy</a></li>
        </ul>
      </aside>
      <!-- Header -->
      <header>
        <!-- First line header -->
        <div class="search-box">
          <span class="icon i-search"></span>
          <input type="text" class="input-search">
        </div>
        <div class="profile-box">
          <span class="icon i-notify"></span>
          <img src="./assets/images/image_profile.png" alt="profile picture">
          <h2>carlos nunez</h2>
        </div>

        <!-- Second line header -->
        <div class="user-box">
          <img src="./assets/images/image_profile.png" alt="profile picture">
          <div class="user-text">
            <p>Ola ke ase,</p>
            <h2>Carlos Nunez (@miiko)</h2>
          </div>
        </div>
        <nav>
          <input class="btn" type="button" value="New">
          <input class="btn" type="button" value="Upload">
          <input class="btn" type="button" value="Share">
        </nav>
      </header>

      <main>
        <!-- Projects -->
        <section class="projects">
          <h2>Your Projects</h2>
          <div class="project-card">
            <h3></h3>
            <p></p>
            <div class="actions"><span class="icon">x</span><span class="icon">x</span><span class="icon">x</span></div>
          </div>
          <div class="project-card">
            <h3></h3>
            <p></p>
            <div class="actions"><span class="icon">x</span><span class="icon">x</span><span class="icon">x</span></div>
          </div>
          <div class="project-card">
            <h3></h3>
            <p></p>
            <div class="actions"><span class="icon">x</span><span class="icon">x</span><span class="icon">x</span></div>
          </div>
          <div class="project-card">
            <h3></h3>
            <p></p>
            <div class="actions"><span class="icon">x</span><span class="icon">x</span><span class="icon">x</span></div>
          </div>
          <div class="project-card">
            <h3></h3>
            <p></p>
            <div class="actions"><span class="icon">x</span><span class="icon">x</span><span class="icon">x</span></div>
          </div>
          <div class="project-card">
            <h3></h3>
            <p></p>
            <div class="actions"><span class="icon">x</span><span class="icon">x</span><span class="icon">x</span></div>
          </div>
        </section>

        <!-- Announcements -->
        <section class="announcements">
          <h2>Announcements</h2>
          <div class="announcements-box">
            <div class="announcement-card">
              <h3></h3>
              <p></p>
            </div>
            <div class="announcement-card">
              <h3></h3>
              <p></p>
            </div>
            <div class="announcement-card">
              <h3></h3>
              <p></p>
            </div>
          </div>
        </section>

        <!-- Trending -->
        <section class="trending">
          <h2>Trending</h2>
          <div class="trending-box">
            <div class="trending-card">
              <img src="" alt="" class="trending-profile:s">
              <h3 class="trending-username"></h3>
              <p></p>
            </div>
            <div class="trending-card">
              <img src="" alt="" class="trending-profile:s">
